[workspace]
authors = ["Phil9S <philip.smith@cruk.cam.ac.uk>"]
channels = ["conda-forge", "bioconda"]
name = "ascat"
platforms = ["linux-64"]
version = "3.2.0"

# Imports of ASCAT v3.2.0 (installed from GitHub in the Dockerfile), plus external tools.
[dependencies]
r-base = "4.4.*"
r-remotes = "*"
r-rcolorbrewer = "*"
"r-data.table" = "*"
r-doparallel = "*"
r-foreach = "*"
bioconductor-iranges = "*"
bioconductor-genomicranges = "*"
bioconductor-s4vectors = "*"
# as in containers/battenberg; bioconda's 4.2.1 (previous image) needs zlib < 1.3, which
# conflicts with current R packages
cancerit-allelecount = "4.3.0.*"
# ps for Nextflow task metrics
procps-ng = "*"
